spring.application.name=ajisoo-backend

server.port=8080

# File-based H2 database stored in ./data/db.mv.db
spring.datasource.url=jdbc:h2:file:./data/db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Optional settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings
# 15 min * 60 sec * 1000 ms
jwt.access-token.validity=900000
# 365 days * 24 hours * 60 minutes * 60 seconds * 1000 milliseconds
jwt.refresh-token.validity=31536000000

# openssl rand -base64 32
jwt.secret.path=jwt_secret.key
# openssl rand -base64 12 for the raw data
otp.path=otp.data
# Custom settings
cookie.verification=false
cors.origin=http://localhost:3000
lights.file=devices.csv
